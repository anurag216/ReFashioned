name: Create Branch and PR from ChatGPT Input

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Name of the new branch'
        required: true
        type: string
      commit_message:
        description: 'Commit message'
        required: true
        type: string
        default: 'Feat: updates from ChatGPT'
      file_path:
        description: 'Path where the file should be created/updated (e.g., src/index.js)'
        required: true
        type: string
      file_content:
        description: 'Paste the raw file content here'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create and switch to new branch
        run: |
          git checkout -b "${{ github.event.inputs.branch_name }}"

      - name: Create or update the file
        run: |
          mkdir -p $(dirname "${{ github.event.inputs.file_path }}")
          cat << 'EOF' > "${{ github.event.inputs.file_path }}"
          ${{ github.event.inputs.file_content }}
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add "${{ github.event.inputs.file_path }}"
          git commit -m "${{ github.event.inputs.commit_message }}"
          git push origin "${{ github.event.inputs.branch_name }}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "${{ github.event.inputs.commit_message }}" \
            --body "Automated Pull Request generated from ChatGPT content." \
            --head "${{ github.event.inputs.branch_name }}" \
            --base main
