name: Validation and Playwright Live E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tracked authentication secrets
        run: pnpm security:secrets

      - name: Type check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build production bundles
        run: pnpm build

  supabase-database:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Start local Supabase
        run: supabase start

      - name: Apply all migrations from a clean database
        run: supabase db reset

      - name: Verify generated database types are current
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          diff -u artifacts/refashioned/src/lib/database.types.ts /tmp/database.types.ts

      - name: Lint database schema
        shell: bash
        run: |
          set -euo pipefail
          set +e
          lint_output="$(supabase db lint --local --level warning 2>&1)"
          lint_status=$?
          set -e
          printf '%s\n' "$lint_output"
          if [[ $lint_status -ne 0 ]]; then
            exit "$lint_status"
          fi
          if grep -Eq '"level"[[:space:]]*:[[:space:]]*"error"' <<<"$lint_output"; then
            echo "Database lint reported errors." >&2
            exit 1
          fi

      - name: Run pgTAP authorization tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

  playwright-security-e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_PASSWORD: Local-E2E-Only-Password-12!
      PLAYWRIGHT_E2E_PASSWORD: Local-E2E-Only-Password-12!
      PLAYWRIGHT_ADMIN_EMAIL: admin@e2e.local
      PLAYWRIGHT_ADMIN_PASSWORD: Local-E2E-Only-Password-12!
      PLAYWRIGHT_SUPPLIER_EMAIL: supplier-user@e2e.local
      PLAYWRIGHT_TEAM_MEMBER_EMAIL: team-manager@e2e.local
      PLAYWRIGHT_LOGOUT_EMAIL: logout-user@e2e.local
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Start clean local Supabase
        run: |
          supabase start
          supabase db reset

      - name: Configure local Supabase environment
        shell: bash
        run: |
          set +x
          supabase status -o env > /tmp/supabase-status.env
          source /tmp/supabase-status.env
          : "${API_URL:?Supabase status did not return API_URL}"
          : "${ANON_KEY:?Supabase status did not return ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?Supabase status did not return SERVICE_ROLE_KEY}"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"
          rm -f /tmp/supabase-status.env

      - name: Install deterministic local E2E fixtures
        run: node artifacts/refashioned/scripts/e2e/setup-local-e2e.mjs

      - name: Build PR application
        run: pnpm --dir artifacts/refashioned build

      - name: Install Chromium
        run: pnpm --dir artifacts/refashioned exec playwright install --with-deps chromium

      - name: Start PR application and wait for readiness
        shell: bash
        run: |
          pnpm --dir artifacts/refashioned serve --host 127.0.0.1 --port 4173 > /tmp/refashioned-vite.log 2>&1 &
          echo "$!" > /tmp/refashioned-vite.pid
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "$PLAYWRIGHT_BASE_URL" > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/refashioned-vite.pid)" 2>/dev/null; then
              cat /tmp/refashioned-vite.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/refashioned-vite.log
          echo "Vite did not become ready" >&2
          exit 1

      - name: Run local Playwright security suite
        run: pnpm test:e2e

      - name: Upload paying-pilot acceptance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-acceptance-${{ github.run_id }}
          path: artifacts/refashioned/test-results/pilot-acceptance/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-security-e2e-${{ github.run_id }}
          path: |
            artifacts/refashioned/playwright-report/
            artifacts/refashioned/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop PR application
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/refashioned-vite.pid ]]; then
            kill "$(cat /tmp/refashioned-vite.pid)" 2>/dev/null || true
          fi

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

  playwright-live-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check live E2E configuration
        shell: bash
        run: |
          : "${PLAYWRIGHT_BASE_URL:?PLAYWRIGHT_BASE_URL is required}"
          : "${PLAYWRIGHT_ADMIN_EMAIL:?PLAYWRIGHT_ADMIN_EMAIL is required}"
          : "${PLAYWRIGHT_ADMIN_PASSWORD:?PLAYWRIGHT_ADMIN_PASSWORD is required}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production-safe Playwright smoke
        run: pnpm test:live-smoke

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-smoke-${{ github.run_id }}
          path: |
            artifacts/refashioned/playwright-report/
            artifacts/refashioned/test-results/
          if-no-files-found: ignore
          retention-days: 7
